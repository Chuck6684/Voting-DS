<!DOCTYPE html>
<html>
<head>
    <title>Network Auditor - Admin</title>
    <style>
        body { font-family: monospace; background: #121212; color: #00ff00; padding: 20px; }
        .node-card { border: 1px solid #00ff00; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .btn-hack { background: #ff0000; color: white; border: none; padding: 10px; cursor: pointer; }
        .btn-restore { background: #00ff00; color: black; border: none; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🛠️ Distributed Network Auditor</h1>
    <div id="node-container"></div>

    <script>
        async function refresh() {
            const res = await fetch('/api/status');
            const nodes = await res.json();
            const container = document.getElementById('node-container');
            container.innerHTML = nodes.map(n => `
                <div class="node-card">
                    <div>
                        [NODE: ${n.name}] <br>
                        STATUS: ${n.malicious ? 'MALICIOUS (Hacked)' : 'HONEST'} <br>
                        LEDGER: ${n.ledger_count} votes synchronized
                    </div>
                    <button class="${n.malicious ? 'btn-restore' : 'btn-hack'}" onclick="toggle(${n.id})">
                        ${n.malicious ? 'RESTORE' : 'HACK NODE'}
                    </button>
                </div>
            `).join('');
        }

        async function toggle(id) {
            await fetch('/api/toggle_hack', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({node_index: id})
            });
            refresh();
        }

        setInterval(refresh, 2000);
        refresh();
    </script>
</body>
</html>
